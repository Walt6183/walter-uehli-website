name: Build & Deploy zu Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build

      - name: Auf Hostinger hochladen (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 92.113.18.95
          username: u656131269
          password: ${{ secrets.HOSTINGER_FTP_PASS }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: true
